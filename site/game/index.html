<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-t="game.title"></title>
    <meta name="description" data-t-content="game.lede" />
    <link rel="stylesheet" href="/src/site.css" />
  </head>
  <body>
    <!--site:top-->
    <main id="main">
      <header class="page-head">
        <h1 data-t="game.title"></h1>
        <p class="lede" data-t="game.lede"></p>
      </header>

      <section class="scene" aria-labelledby="overlook">
        <img class="frame" data-art="overlook" data-t-alt="home.heroAlt" />
        <div>
          <h2 id="overlook" data-t="game.overlookHead"></h2>
          <p data-t="game.overlookSetOut"></p>
          <p data-t="game.overlookPlayers"></p>
          <p data-t="game.overlookDo"></p>
        </div>
      </section>

      <section class="scene" aria-labelledby="ship">
        <img class="frame" data-art="under-sail" data-t-alt="game.shipAlt" loading="lazy" />
        <div>
          <h2 id="ship" data-t="game.shipHead"></h2>
          <p data-t="game.shipOwn"></p>
          <p data-t="game.shipWaters"></p>
          <p data-t="game.shipGear"></p>
          <p data-t="game.shipCrew"></p>
          <p data-t="game.shipPeace"></p>
        </div>
      </section>

      <section class="scene" aria-labelledby="arts">
        <img class="frame" data-art="arts" data-t-alt="game.artsAlt" loading="lazy" />
        <div>
          <h2 id="arts" data-t="game.artsHead"></h2>
          <p data-t="game.artsThree"></p>
          <p data-t="game.artsEach"></p>
          <p data-t="game.artsKept"></p>
          <p data-t="game.artsPledge"></p>
          <p data-t="game.artsLevels"></p>
        </div>
      </section>

      <section class="scene" aria-labelledby="gear">
        <img class="frame" data-art="gear" data-t-alt="game.gearAlt" loading="lazy" />
        <div>
          <h2 id="gear" data-t="game.gearHead"></h2>
          <p data-t="game.gearPower"></p>
          <p data-t="game.gearEarn"></p>
          <p data-t="game.gearNodes"></p>
          <p data-t="game.gearSpend"></p>
          <p data-t="game.gearUse"></p>
        </div>
      </section>

      <section class="passage closing">
        <p class="buttons"><a class="button button-gold button-big" data-to="play" data-t="shell.navPlay"></a></p>
      </section>
    </main>
    <!--site:foot-->
  </body>
</html>
