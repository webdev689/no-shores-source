<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-t="world.title"></title>
    <meta name="description" data-t-content="world.description" />
    <link rel="stylesheet" href="/src/site.css" />
  </head>
  <body>
    <!--site:top-->
    <main id="main">
      <header class="page-head">
        <h1 data-t="world.title"></h1>
        <p class="lede" data-t="premise.opening"></p>
      </header>

      <section class="scene" aria-labelledby="expanse">
        <img class="frame" data-art="expanse" data-t-alt="world.expanseAlt" />
        <div>
          <h2 id="expanse" data-t="world.expanseHead"></h2>
          <p data-t="premise.expanse"></p>
          <p data-t="premise.coast"></p>
          <p data-t="premise.three"></p>
          <p data-t="premise.ruin"></p>
          <p data-t="premise.stranger"></p>
        </div>
      </section>

      <section class="passage">
        <p class="beat" data-t="premise.history"></p>
        <p data-t="premise.maps"></p>
      </section>

      <section class="scene" aria-labelledby="tithe">
        <img class="frame" data-art="grey-tithe" data-t-alt="world.titheAlt" loading="lazy" />
        <div>
          <h2 id="tithe" data-t="world.titheHead"></h2>
          <p data-t="premise.tithe"></p>
        </div>
      </section>

      <section class="scene" aria-labelledby="overlook">
        <img class="frame" data-art="overlook" data-t-alt="home.heroAlt" loading="lazy" />
        <div>
          <h2 id="overlook" data-t="world.overlookHead"></h2>
          <p data-t="premise.refuses"></p>
          <p data-t="premise.overlook"></p>
          <p data-t="premise.begins"></p>
        </div>
      </section>

      <section class="scene" aria-labelledby="ambush">
        <img class="frame" data-art="thule" data-t-alt="world.ambushAlt" loading="lazy" />
        <div>
          <h2 id="ambush" data-t="world.ambushHead"></h2>
          <p data-t="premise.ambush"></p>
        </div>
      </section>

      <section class="scene" aria-labelledby="depths">
        <img class="frame" data-art="depths" data-t-alt="world.depthsAlt" loading="lazy" />
        <div>
          <h2 id="depths" data-t="world.depthsHead"></h2>
          <p data-t="premise.depths"></p>
          <p data-t="premise.calls"></p>
        </div>
      </section>

      <section class="scene" aria-labelledby="shore">
        <img class="frame" data-art="shore" data-t-alt="world.shoreAlt" loading="lazy" />
        <div>
          <h2 id="shore" data-t="world.shoreHead"></h2>
          <p data-t="premise.survives"></p>
        </div>
      </section>

      <section class="scene" aria-labelledby="ruins">
        <img class="frame" data-art="ruined-port" data-t-alt="world.ruinsAlt" loading="lazy" />
        <div>
          <h2 id="ruins" data-t="world.ruinsHead"></h2>
          <p data-t="premise.truth"></p>
          <p data-t="premise.growth"></p>
          <p data-t="premise.confined"></p>
          <p data-t="premise.farther"></p>
        </div>
      </section>

      <section class="passage closing">
        <p data-t="premise.countless"></p>
        <p class="beat" data-t="premise.safety"></p>
        <p class="buttons"><a class="button button-gold button-big" data-to="play" data-t="home.play"></a></p>
      </section>
    </main>
    <!--site:foot-->
  </body>
</html>
