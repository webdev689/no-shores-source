name: freesound

# Finds candidates on Freesound for the sounds wanted in content/audio/freesound.json, whenever that list or this tool
# changes: each cue's first few CC0 or Attribution sounds of its length, their previews and who made them, kept as
# the run's download for the audio test sheet. It needs no key: it reads Freesound's public pages, as a person
# browsing would. Freesound refuses Claude's cloud machines, so the search runs here.
on:
  push:
    paths: [content/audio/freesound.json, tools/freesound/**, .github/workflows/freesound.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test the page reader
        run: node --test tools/freesound/pages.test.mjs
      - name: Find the candidates
        run: node tools/freesound/candidates.mjs freesound-candidates
      # Kept even when the search stops partway, with the pages it read, so a refusal or a changed page can be read.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: freesound-candidates
          path: freesound-candidates
          if-no-files-found: warn
          retention-days: 30
