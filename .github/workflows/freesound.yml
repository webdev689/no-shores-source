name: freesound

# Finds candidates on Freesound for the sounds wanted in content/audio/freesound.json, whenever that list or this tool
# changes: each cue's first few CC0 or Attribution sounds of its length, their previews and who made them, kept as
# the run's download for the audio test sheet. It needs no key: it reads Freesound's public pages, as a person
# browsing would. Freesound refuses Claude's cloud machines, so the search runs here, and so does the publish of the
# owner's picks to R2, with the repository's Cloudflare token.
on:
  push:
    paths: [content/audio/freesound.json, tools/freesound/**, .github/workflows/freesound.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test the page reader
        run: node --test tools/freesound/pages.test.mjs
      - name: Find the candidates
        run: node tools/freesound/candidates.mjs freesound-candidates
      # A long pick is cut with ffmpeg, which decodes a stranger's audio: in steps that hold no key.
      - name: Install ffmpeg
        run: sudo apt-get install -y -q ffmpeg > /dev/null
      - name: Cut the long picks
        run: python3 -I tools/freesound/publish.py --cut freesound-candidates
      # The owner's picks go to R2 with the repository's Cloudflare token, each named by its hash, so a run changes
      # nothing already there; this step runs no ffmpeg. The game's list of them is kept with the download
      # (sounds.json) for a commit to take in. Without the token the run says so and publishes nothing.
      - name: Publish the picks to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::the repository has no CLOUDFLARE_TOKEN secret: no pick is published"
            exit 0
          fi
          python3 -I tools/freesound/publish.py freesound-candidates
          cp content/audio/sounds.json freesound-candidates/sounds.json
      # Kept even when the search stops partway, with the pages it read, so a refusal or a changed page can be read.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: freesound-candidates
          path: freesound-candidates
          if-no-files-found: warn
          retention-days: 30
