name: rooms

# Deploys the accounts and then the rooms to Cloudflare with the repository's Cloudflare token: the accounts' Worker
# over its D1 database (made if it is not there, its migrations applied first, the Discord app's keys handed over when
# the repository has them), then the rooms (built first without the token, then deployed with it alone), whose
# service binding reaches the accounts. ci.yml calls it from main once the same commit has passed the check, before it
# publishes the page, and it deploys only when what the rooms are built from has changed since their last deploy; it
# also runs by hand from main, deploying whether anything changed or not, but only a commit whose own CI check passed:
# a run on one that has not ends red and deploys nothing. It tells ci.yml whether the rooms had nothing to deploy,
# deployed, or could not, so the page is published only in the first two cases.
on:
  workflow_call:
    outputs:
      deploy:
        description: 'yes when the rooms were to deploy, no when they had nothing to, blocked when they could not'
        value: ${{ jobs.ready.outputs.deploy }}
      deployed:
        description: 'yes once the rooms deployed'
        value: ${{ jobs.deploy.outputs.deployed }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Merges are checked side by side, so an older one can finish last: it deploys only while it is still main's head.
  # Without the token, nothing deploys and main stays green, with a warning to add it.
  ready:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      checks: read
    outputs:
      deploy: ${{ steps.ready.outputs.deploy }}
    steps:
      # The history without its files' contents, to compare the rooms' code with that of their last deploy.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN != '' }}
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
          # What the rooms are built from: the crates of `room-wasm` and of the bake, the Workers and the page's files
          # they import (the sea's ports read as the page reads them), the schema's maker and its list
          # (tools/numbered.json), the content they read, the toolchain, the locks and the scripts that deploy, and this
          # workflow.
          ROOMS_CODE: >-
            crates/bake crates/city crates/combat crates/dungeon crates/foes crates/gear crates/isle crates/land
            crates/layout crates/movement crates/naval crates/navmesh crates/protocol crates/reach crates/room
            crates/room-wasm crates/sailing crates/sky crates/world server tools/schema.mjs tools/numbered.json
            content/world content/islands/kits.json content/testground content/gear content/arts content/modules
            content/dungeon content/lore content/quests content/story/cast.json content/ships/ships.json content/forged
            client/src/game/worldData.ts client/src/game/nodes.ts client/src/ruinedName.ts client/src/player/binds.ts
            Cargo.toml Cargo.lock rust-toolchain.toml package.json package-lock.json .github/workflows/rooms.yml
        run: |
          repo="${{ github.repository }}"
          head=$(gh api "repos/$repo/commits/main" --jq .sha)
          # The commit the rooms were last deployed from: the newest deployment to `rooms` whose last word is success.
          # With none found, they deploy.
          list=$(gh api "repos/$repo/deployments?environment=rooms&per_page=30" \
            --jq '.[] | "\(.sha) \(.id)"') || list=""
          deployed=""
          while read -r sha id; do
            [ -n "$id" ] || continue
            state=$(gh api "repos/$repo/deployments/$id/statuses" --jq '.[0].state') || state=""
            if [ "$state" = success ]; then deployed=$sha; break; fi
          done <<< "$list"
          # Whether this commit passed main's CI check: a check run named `check`, of GitHub Actions, that succeeded.
          passed() {
            gh api "repos/$repo/commits/${{ github.sha }}/check-runs?check_name=check" \
              --jq 'any(.check_runs[]; .app.slug == "github-actions" and .conclusion == "success")'
          }
          if [ "$head" != "${{ github.sha }}" ]; then
            echo "main has moved past this commit; its own run deploys the rooms"
            echo "deploy=no" >> "$GITHUB_OUTPUT"
          elif [ "$BY_HAND" = "true" ] && [ "$(passed)" != true ]; then
            echo "::error::by hand the rooms deploy only a commit that passed the CI check, and this one has not"
            exit 1
          elif [ "$BY_HAND" != "true" ] && [ -n "$deployed" ] &&
            git diff --quiet --no-renames "$deployed" HEAD -- $ROOMS_CODE; then
            echo "the rooms' code is as deployed from $deployed: nothing to deploy"
            echo "deploy=no" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_TOKEN" != "true" ]; then
            # The rooms cannot deploy, so the page waits too: none is published on a protocol no room speaks.
            echo "::warning::the repository has no CLOUDFLARE_TOKEN secret, so the rooms and the page were not deployed"
            echo "deploy=blocked" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=yes" >> "$GITHUB_OUTPUT"
          fi

  # One deploy at a time; a newer merge's deploy replaces one waiting. The database's id never enters the repository:
  # it is looked up, or the database made, and written into this runner's copy of the config. The Cloudflare token
  # reaches only the steps that run wrangler, never `npm ci` and the packages it installs.
  accounts:
    needs: ready
    if: needs.ready.outputs.deploy == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: accounts
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: a27adccb38c8e8b82fa32e5736274a94
      CONFIG: server/accounts/wrangler.jsonc
      DATABASE: overlook-accounts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install the TypeScript tools
        run: npm ci
      - name: Find the database, or make it, and name it in the config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          set -euo pipefail
          listed() { npx wrangler d1 list --json | jq -r --arg name "$DATABASE" 'map(select(.name == $name)) | .[0].uuid // .[0].id // empty'; }
          id=$(listed)
          if [ -z "$id" ]; then
            npx wrangler d1 create "$DATABASE"
            id=$(listed)
          fi
          test -n "$id" || { echo "::error::Cloudflare named no id for $DATABASE"; exit 1; }
          sed -i "s/\"set-by-the-deploy\"/\"$id\"/" "$CONFIG"
          grep -q "\"$id\"" "$CONFIG" || { echo "::error::the id did not reach $CONFIG"; exit 1; }
      - name: Apply the migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: npx wrangler d1 migrations apply "$DATABASE" --remote --config "$CONFIG"
      - name: Deploy the accounts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: npx wrangler deploy --config "$CONFIG"
      # Each key goes in from a pipe, never a command line or a file, and only when the repository has it.
      - name: Hand over the Discord app's keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name" --config "$CONFIG"
            else
              echo "::warning::the repository has no $name secret: Discord sign-in is off unless an earlier deploy gave the Worker one"
            fi
          done
      - name: Check the accounts answer
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 https://overlook-accounts.mackcothran.workers.dev/v1/health; then exit 0; fi
            sleep 10
          done
          echo "::error::the accounts did not answer /v1/health"
          exit 1

  # The rooms deploy after the accounts, whose Worker their service binding names; a failed accounts deploy leaves
  # the last one serving, so the rooms still deploy.
  deploy:
    needs: [ready, accounts]
    if: ${{ !cancelled() && needs.ready.outputs.deploy == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rooms
      cancel-in-progress: false
    # Each deploy is recorded against the commit it came from, which the next run compares with.
    environment: rooms
    env:
      CLOUDFLARE_ACCOUNT_ID: a27adccb38c8e8b82fa32e5736274a94
    outputs:
      deployed: ${{ steps.deployed.outputs.deployed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install the TypeScript tools
        run: npm ci
      # The room and its data are built without the token, so no build script or tool run while building can read it.
      - name: Build the room and its data
        run: npm run -s schema && npm run -s wasm && npm run -s bake
      - name: Deploy the rooms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: npx wrangler deploy --config server/wrangler.jsonc
      - id: deployed
        run: echo "deployed=yes" >> "$GITHUB_OUTPUT"
