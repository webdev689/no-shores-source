# Deploys the rooms Worker to Cloudflare from main, by hand: run it only with the owner's yes (Ask Before Deploying).
# A cloud session cannot deploy the rooms itself: its proxy puts the saved token in place of the short-lived one
# wrangler uploads the node files with. The token is the repository's CLOUDFLARE_SECRET secret.
name: rooms

on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; one asked for while another runs waits for it.
concurrency:
  group: rooms
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the token is set
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::the repository has no CLOUDFLARE_SECRET secret"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SECRET }}
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the TypeScript tools
        run: npm ci
      # Nothing is deployed that the check has not passed; the check also builds the messages and the WebAssembly.
      - name: cargo xtask check
        run: cargo xtask check
      - name: Deploy the rooms
        run: npm run server:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SECRET }}
