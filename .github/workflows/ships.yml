name: ships

# Paints the Sloop's model with the game's pictures, and builds and paints the Schooner's, the Brig's and the Frigate's,
# and publishes each with its mesh to R2 with the repository's Cloudflare token, whenever the ship tools change. R2's
# objects are named by their hashes, so a run changes nothing already published; the log ends with each manifest entry
# on one line, her deck left out, which a commit then takes into content/ships/ships.json, and `tools/ships/deck.py
# <name>` measures her deck from her published mesh.
on:
  push:
    paths: [tools/ships/**, .github/workflows/ships.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The token reaches only the two steps that check it and publish: npm ci and pip run others' install scripts.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      # Without the token there is nothing to publish with: the run says so and stops, rather than failing main.
      - name: Check the token is set
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::the repository has no CLOUDFLARE_TOKEN secret: nothing is published"; fi
      - name: Install Blender's module and the TypeScript tools
        if: steps.token.outputs.set == 'true'
        run: pip install bpy==5.3.0 && npm ci
      # She stands three times her source model, her quarterdeck opened with steps down, so her
      # waterline, 0.4 m up that model, is 1.2 m up her.
      - name: Paint and publish the Sloop
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          source=$(node -p "const m = require('./content/ships/ships.json'); m.base + m.ships.sloop.source")
          curl -sSfo "$RUNNER_TEMP/sloop.blend" "$source"
          node tools/ships/ship_pictures.ts "$RUNNER_TEMP/pictures.bin"
          python -I tools/ships/shape_ship.py -- "$RUNNER_TEMP/sloop.blend" "$RUNNER_TEMP/shaped.blend" --scale 3
          python -I tools/ships/paint_ship.py -- "$RUNNER_TEMP/shaped.blend" "$RUNNER_TEMP/Sloop.blend" \
            --pictures "$RUNNER_TEMP/pictures.bin"
          python -I tools/ships/export_ship.py "$RUNNER_TEMP/Sloop.blend" sloop --waterline 1.2
          node -p "const { deck, ...entry } = require('./content/ships/ships.json').ships.sloop; JSON.stringify(entry)"
      # The Schooner, the Brig and the Frigate, each built from her numbers with the Sloop's own guns, then painted and
      # published as the Sloop is. Each entry is printed with her helm alone of her deck, which tools/ships/deck.py then
      # measures from her mesh.
      - name: Build, paint and publish the Schooner, the Brig and the Frigate
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          for ship in schooner brig frigate; do
            python -I tools/ships/build_ship.py "$ship" "$RUNNER_TEMP/$ship.blend" --sloop "$RUNNER_TEMP/sloop.blend"
            python -I tools/ships/paint_ship.py -- "$RUNNER_TEMP/$ship.blend" "$RUNNER_TEMP/${ship^}.blend" \
              --pictures "$RUNNER_TEMP/pictures.bin"
            python -I tools/ships/export_ship.py "$RUNNER_TEMP/${ship^}.blend" "$ship" --waterline 1.2
            node -p "const ship = require('./content/ships/ships.json').ships['$ship']; \
              JSON.stringify({ ...ship, deck: { helm: ship.deck.helm } })"
          done
