name: ships

# Paints the Sloop's model with the game's pictures, and builds and paints the Schooner's, the Brig's and the Frigate's,
# and publishes each with its mesh to R2 whenever the ship tools change: the job that builds holds no secret and stages
# them, and a second job, which only uploads them, holds the repository's R2 token. R2's objects are named by their
# hashes, so a run changes nothing already published; the build's log ends with each manifest entry on one line, her
# deck left out, which a commit takes into content/ships/ships.json once the run has published, and
# `tools/ships/deck.py <name>` measures her deck from her published mesh.
on:
  push:
    paths: [tools/ships/**, .github/workflows/ships.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Installs others' code (pip, npm), so it holds no secret: what it stages for R2 goes on as an artifact.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      staged: ${{ steps.staged.outputs.staged }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install Blender's module and the TypeScript tools
        run: pip install bpy==5.3.0 && npm ci
      - name: Test the export's mesh bytes
        run: python -I tools/ships/test_export.py
      # She stands three times her source model, her quarterdeck opened with steps down, so her
      # waterline, 0.4 m up that model, is 1.2 m up her. Her source's key is the hash of its bytes, so what is fetched
      # is checked against it before Blender opens it.
      - name: Paint and stage the Sloop
        env:
          R2_STAGE: ${{ runner.temp }}/stage
        run: |
          key=$(node -p "require('./content/ships/ships.json').ships.sloop.source")
          base=$(node -p "require('./content/ships/ships.json').base")
          curl -sSfo "$RUNNER_TEMP/sloop.blend" "$base$key"
          echo "$(basename "$key" .blend)  $RUNNER_TEMP/sloop.blend" | sha256sum -c --quiet -
          node tools/ships/ship_pictures.ts "$RUNNER_TEMP/pictures.bin"
          python -I tools/ships/shape_ship.py -- "$RUNNER_TEMP/sloop.blend" "$RUNNER_TEMP/shaped.blend" --scale 3
          python -I tools/ships/paint_ship.py -- "$RUNNER_TEMP/shaped.blend" "$RUNNER_TEMP/Sloop.blend" \
            --pictures "$RUNNER_TEMP/pictures.bin"
          python -I tools/ships/export_ship.py "$RUNNER_TEMP/Sloop.blend" sloop --waterline 1.2
          node -p "const { deck, ...entry } = require('./content/ships/ships.json').ships.sloop; JSON.stringify(entry)"
      # The Schooner, the Brig and the Frigate, each built from her numbers with the Sloop's own guns, then painted and
      # staged as the Sloop is. Each entry is printed with her helm alone of her deck, which tools/ships/deck.py then
      # measures from her mesh.
      - name: Build, paint and stage the Schooner, the Brig and the Frigate
        env:
          R2_STAGE: ${{ runner.temp }}/stage
        run: |
          for ship in schooner brig frigate; do
            python -I tools/ships/build_ship.py "$ship" "$RUNNER_TEMP/$ship.blend" --sloop "$RUNNER_TEMP/sloop.blend"
            python -I tools/ships/paint_ship.py -- "$RUNNER_TEMP/$ship.blend" "$RUNNER_TEMP/${ship^}.blend" \
              --pictures "$RUNNER_TEMP/pictures.bin"
            python -I tools/ships/export_ship.py "$RUNNER_TEMP/${ship^}.blend" "$ship" --waterline 1.2
            node -p "const ship = require('./content/ships/ships.json').ships['$ship']; \
              JSON.stringify({ ...ship, deck: { helm: ship.deck.helm } })"
          done
      - name: Say whether anything is staged
        id: staged
        run: if [ -d "$RUNNER_TEMP/stage" ]; then echo "staged=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.staged.outputs.staged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r2-stage
          path: ${{ runner.temp }}/stage
          retention-days: 1

  # A fresh machine with nothing installed, and the only job that holds the token: tools/r2.py uploads the stage's
  # files, each only if it is named by its own hash under a folder a publisher writes.
  publish:
    needs: build
    if: needs.build.outputs.staged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: r2-stage
          path: ${{ runner.temp }}/stage
      # Without the token there is nothing to publish with: the run says so and stops, rather than failing.
      - name: Check the token is set
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::the repository has no CLOUDFLARE_TOKEN secret: nothing is published"; fi
      - name: Upload what the build staged
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: python3 -I tools/r2.py upload "$RUNNER_TEMP/stage"
