name: island-modules

# Builds every island kit's modules in Blender, checks each against its envelope, and publishes the packs and the
# model to R2 with the repository's R2 token, whenever the modules' tools or contract change. R2's objects
# are named by their hashes, so a pack already published is not sent again, and the model is kept while every pack
# is the one the manifest names. The log ends with the manifest on one line, which a commit then takes into
# content/islands/modules.json; the run warns while the committed one is behind. The contact sheets are kept as the
# run's artifact.
on:
  push:
    paths:
      - tools/islands/**
      - tools/r2.py
      - content/islands/kits.json
      - .github/workflows/island-modules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Installs others' code (pip), so it holds no secret: what it builds goes on as an artifact.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Check the contract and the envelopes without Blender
        run: python -I tools/islands/test_envelope.py
      - name: Install Blender's module
        run: pip install bpy==5.3.0 pillow
      # The previews are every module in flat part colours, for a person to look over; the game paints them.
      - name: Build every kit's modules
        run: python -I tools/islands/build.py --out "$RUNNER_TEMP/modules" --preview
      - name: Check the packs the build wrote
        env:
          ISLAND_MODULES: ${{ runner.temp }}/modules
        run: python -I tools/islands/test_envelope.py
      # A pack is named by its hash, so a build that changes its bytes from run to run would publish a new pack and
      # leave the manifest and every machine's own build disagreeing.
      - name: Build again and check every pack is the same bytes
        run: |
          python -I tools/islands/build.py --out "$RUNNER_TEMP/again"
          for pack in "$RUNNER_TEMP"/modules/*.modules; do cmp "$pack" "$RUNNER_TEMP/again/$(basename "$pack")"; done
      # Kept when the build fails too: the sheets show what a refused module looks like.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: island-module-previews
          path: ${{ runner.temp }}/modules/previews/*.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: island-modules
          path: |
            ${{ runner.temp }}/modules/*.modules
            ${{ runner.temp }}/modules/modules.blend
            ${{ runner.temp }}/modules/built.json

  # A fresh machine with nothing installed: the publisher needs Python's own library and the repository alone.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: island-modules
          path: ${{ runner.temp }}/modules
      # Without the token there is nothing to publish with: the run says so and stops, rather than failing.
      - name: Check the token is set
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::the repository has no R2_TOKEN secret: nothing is published"; fi
      - name: Publish the packs and the model
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_TOKEN }}
        run: python -I tools/islands/publish.py "$RUNNER_TEMP/modules"
      # The manifest publish.py writes goes with the run's machine: until a commit takes it, the page draws old packs.
      - name: Say whether the committed manifest is behind
        if: steps.token.outputs.set == 'true'
        run: |
          if ! git diff --quiet -- content/islands/modules.json; then
            echo "::warning::content/islands/modules.json is behind these packs: commit the publish step's last line"
          fi
