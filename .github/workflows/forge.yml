name: forge

# Renders the forge's pictures that the game draws as they are, beside the published figures (the Arts' birds, the
# weapons drawn large and the material nodes), and publishes them to R2 whenever their tools change on main or a run
# is asked for on a branch; a run asked for may also draw figure strips for both bodies (`figures`) and the first
# person's dagger and sword frames for both hands (`firstperson`). The job that
# renders holds no secret and stages them, and a second job, which only uploads them, holds the repository's R2 token.
# R2's objects are named by their hashes, so a run changes nothing already published; the render's log ends with the
# forge's manifest on one line, which a commit takes into content/forge/renders.json once the run has published.
on:
  push:
    branches: [main]
    paths:
      # The three tools and every module they import: the weapons' reach most of the forge's own (layers, the bodies,
      # the metals, the first person's makes), so any of its modules may change what they draw.
      - tools/forge/tools/sprite-forge/*.py
      # The material nodes are laid from the item forge's models, any of which may change them.
      - tools/forge/tools/sprite-forge/items/**
      - tools/forge/tools/sprite-forge/specs/item-ramps.json
      - tools/forge/tools/sprite-forge/specs/pictures/nodes.json
      - tools/forge/tools/sprite-forge/artbirds-requirements.txt
      - .github/workflows/forge.yml
  workflow_dispatch:
    inputs:
      figures:
        description: "Figure strips to draw first, both bodies: runs split by ';', each 'anims|layers', empty for all"
        required: false
        default: ''
      firstperson:
        description: "First-person frames to draw, both hands: runs split by ';', each 'weapon|metals' (dagger or sword; metals empty for all)"
        required: false
        default: ''

permissions:
  contents: read

# Two runs would publish the same tables at once; the second waits for the first.
concurrency:
  group: forge
  cancel-in-progress: false

jobs:
  # Installs others' code (pip), so it holds no secret: what it stages for R2 goes on as an artifact.
  build:
    runs-on: ubuntu-latest
    # On four cores a run drawing figure strips takes hours (six blade layers, both bodies, about four: 10,220 frames
    # at about 1.3 s), so it has the hosted runner's most; every make's first-person frames, both weapons and both
    # hands, reckoned at about 40 minutes (a blade's, a few); the birds and the weapons, minutes.
    timeout-minutes: ${{ inputs.figures && 360 || inputs.firstperson && 90 || 20 }}
    outputs:
      staged: ${{ steps.staged.outputs.staged }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install Blender's module
        run: |
          pip install --require-hashes --only-binary=:all: -r tools/forge/tools/sprite-forge/artbirds-requirements.txt
      - name: Render the Arts' birds
        working-directory: tools/forge
        run: python -I tools/sprite-forge/artbirds.py --out public/art/arts/birds
      - name: Render the weapons drawn large
        working-directory: tools/forge
        run: python -I tools/sprite-forge/weaponart.py --out public/art/weapons
      - name: Render the material nodes
        working-directory: tools/forge
        run: |
          nodes=$(python -c "import json; print(','.join(json.load(open('tools/sprite-forge/specs/pictures/nodes.json'))['pictures']))")
          python -I tools/sprite-forge/itempics.py --set pictures --only "$nodes" --out public/art/studio/forge
      # A held weapon's layers (fplayers.py): the weapon alone in each metal asked for, the right hand's and the left's
      # twin, into the folder of the archive the game reads them from. The hands stay as published. Drawn before the
      # figure strips, so a failure here costs minutes, not the strips' hours.
      - name: Draw the first-person frames asked for
        if: inputs.firstperson
        env:
          FIRSTPERSON: ${{ inputs.firstperson }}
        run: |
          python -I tools/forge_publish.py pull
          IFS=';' read -ra runs <<< "$FIRSTPERSON"
          for run in "${runs[@]}"; do
            weapon=${run%%|*}; metals=${run#*|}
            case $weapon in dagger) archive=WEAPON02 ;; sword) archive=WEAPON04 ;;
              *) echo "::error::no first-person weapon '$weapon'"; exit 1 ;; esac
            for hand in '' --left; do
              (cd tools/forge && python -I tools/sprite-forge/fplayers.py --weapon "$weapon" --sets '' $hand \
                ${metals:+--metals "$metals"} --out "public/art/studio/forge/$archive/layers")
            done
          done
      # Figure strips over the published tables (layers.py), each whose inputs changed drawn again.
      - name: Draw the figure strips asked for
        if: inputs.figures
        env:
          FIGURES: ${{ inputs.figures }}
        run: |
          python -I tools/forge_publish.py pull
          IFS=';' read -ra runs <<< "$FIGURES"
          for run in "${runs[@]}"; do
            anims=${run%%|*}; layers=${run#*|}
            for body in male female; do
              (cd tools/forge && python -I tools/sprite-forge/layers.py --body "$body" ${anims:+--anims "$anims"} \
                ${layers:+--layers "$layers"} --out public/art/studio/forge/layers)
            done
          done
      # The published tables first (kept as the figures left them), then the new pictures beside what is published.
      - name: Stage them
        env:
          R2_STAGE: ${{ runner.temp }}/stage
          FIGURES: ${{ inputs.figures }}
          FIRSTPERSON: ${{ inputs.firstperson }}
        run: |
          [ -n "$FIGURES$FIRSTPERSON" ] || python -I tools/forge_publish.py pull
          python -I tools/forge_publish.py add
          node -p "JSON.stringify(require('./content/forge/renders.json'))"
      - name: Say whether anything is staged
        id: staged
        run: if [ -d "$RUNNER_TEMP/stage" ]; then echo "staged=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.staged.outputs.staged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r2-stage
          path: ${{ runner.temp }}/stage
          retention-days: 1

  # A fresh machine with nothing installed, and the only job that holds the token: tools/r2.py uploads the stage's
  # files, each only if it is named by its own hash under a folder a publisher writes.
  publish:
    needs: build
    if: needs.build.outputs.staged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: r2-stage
          path: ${{ runner.temp }}/stage
      # Without the token there is nothing to publish with: the run says so and stops, rather than failing.
      - name: Check the token is set
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::the repository has no CLOUDFLARE_TOKEN secret: nothing is published"; fi
      - name: Upload what the build staged
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: python3 -I tools/r2.py upload "$RUNNER_TEMP/stage"
