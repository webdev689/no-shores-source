name: forge

# Renders the forge's pictures that the game draws as they are, beside the published figures (the Arts' birds and the
# weapons drawn large), and publishes them to R2 with the repository's Cloudflare token, whenever their tools change
# on main or a run is asked for on a branch; a run asked for may also draw figure strips for both bodies (`figures`).
# R2's objects are named by their hashes, so a run changes nothing already published; the log ends with the forge's
# manifest on one line, which a commit then takes into content/forge/renders.json.
on:
  push:
    branches: [main]
    paths:
      - tools/forge/tools/sprite-forge/artbirds.py
      - tools/forge/tools/sprite-forge/weaponart.py
      - tools/forge/tools/sprite-forge/artbirds-requirements.txt
      - .github/workflows/forge.yml
  workflow_dispatch:
    inputs:
      figures:
        description: "Figure strips to draw first, both bodies: runs split by ';', each 'anims|layers', empty for all"
        required: false
        default: ''

permissions:
  contents: read

# Two runs would publish the same tables at once; the second waits for the first.
concurrency:
  group: forge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A run drawing figure strips takes hours on four cores; the birds and the weapons, minutes.
    timeout-minutes: ${{ inputs.figures && 300 || 20 }}
    # The token reaches only the two steps that check it and publish. What the publishing step imports (Pillow) is
    # installed as the exact wheels the requirements name by their hashes, and the checkout keeps no git credential.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      # Without the token there is nothing to publish with: the run says so and stops, rather than failing main.
      - name: Check the token is set
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::the repository has no CLOUDFLARE_TOKEN secret: nothing is published"; fi
      - name: Install Blender's module
        if: steps.token.outputs.set == 'true'
        run: |
          pip install --require-hashes --only-binary=:all: -r tools/forge/tools/sprite-forge/artbirds-requirements.txt
      - name: Render the Arts' birds
        if: steps.token.outputs.set == 'true'
        working-directory: tools/forge
        run: python -I tools/sprite-forge/artbirds.py --out public/art/arts/birds
      - name: Render the weapons drawn large
        if: steps.token.outputs.set == 'true'
        working-directory: tools/forge
        run: python -I tools/sprite-forge/weaponart.py --out public/art/weapons
      # Figure strips over the published tables (layers.py), each whose inputs changed drawn again; no token here.
      - name: Draw the figure strips asked for
        if: steps.token.outputs.set == 'true' && inputs.figures
        env:
          FIGURES: ${{ inputs.figures }}
        run: |
          python -I tools/forge_publish.py pull
          IFS=';' read -ra runs <<< "$FIGURES"
          for run in "${runs[@]}"; do
            anims=${run%%|*}; layers=${run#*|}
            for body in male female; do
              (cd tools/forge && python -I tools/sprite-forge/layers.py --body "$body" ${anims:+--anims "$anims"} \
                ${layers:+--layers "$layers"} --out public/art/studio/forge/layers)
            done
          done
      # The published tables first (kept as the figures left them), then the new pictures beside what is published.
      - name: Publish them
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          FIGURES: ${{ inputs.figures }}
        run: |
          [ -n "$FIGURES" ] || python -I tools/forge_publish.py pull
          python -I tools/forge_publish.py add
          node -p "JSON.stringify(require('./content/forge/renders.json'))"
