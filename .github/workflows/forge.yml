name: forge

# Renders the forge's pictures that the game draws as they are, beside the published figures (the Arts' birds), and
# publishes them to R2 with the repository's Cloudflare token, whenever their tools change. R2's objects are named by
# their hashes, so a run changes nothing already published; the log ends with the forge's manifest on one line, which
# a commit then takes into content/forge/renders.json.
on:
  push:
    paths: [tools/forge/tools/sprite-forge/artbirds.py, .github/workflows/forge.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The token reaches only the two steps that check it and publish: pip runs others' install scripts.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Without the token there is nothing to publish with: the run says so and stops, rather than failing main.
      - name: Check the token is set
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::the repository has no CLOUDFLARE_TOKEN secret: nothing is published"; fi
      - name: Install Blender's module
        if: steps.token.outputs.set == 'true'
        run: pip install bpy==5.2.3 pillow
      - name: Render the Arts' birds
        if: steps.token.outputs.set == 'true'
        working-directory: tools/forge
        run: python -I tools/sprite-forge/artbirds.py --out public/art/arts/birds
      # The published tables first, then the new pictures beside what is published.
      - name: Publish them
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          python -I tools/forge_publish.py pull
          python -I tools/forge_publish.py add
          node -p "JSON.stringify(require('./content/forge/renders.json'))"
