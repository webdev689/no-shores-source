name: flora

# Grows every plant of every biome in Blender, bakes each into a near mesh and impostor sprites, and publishes them
# to R2 with the repository's R2 token whenever the flora tools change. R2's objects are named by their
# hashes, so a run changes nothing already published; the log ends with the manifest, which a commit then takes into
# content/nature/flora.json.
on:
  push:
    paths: [tools/flora/**, .github/workflows/flora.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # The token reaches only the two steps that check it and publish: pip runs others' install scripts.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Without the token there is nothing to publish with: the run says so and stops, rather than failing main.
      - name: Check the token is set
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::the repository has no R2_TOKEN secret: nothing is published"; fi
      # The generator's check runs with or without the token.
      - name: Install Blender's module
        run: pip install bpy==5.3.0
      - name: Check the generator grows the same plant from the same seed
        run: python -I tools/flora/test_flora.py
      - name: Bake and publish the flora
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_TOKEN }}
        run: |
          python -I tools/flora/publish.py
          cat content/nature/flora.json
