name: lattice

# Renders the Lattice's foes, every move from all five views, and its death wave (tools/lattice/), and publishes them
# to R2 beside the forge's published renders with the repository's Cloudflare token, only when a run is asked for. A
# job a move renders in parallel; one job lays them all in and publishes, and its log ends with the forge's manifest
# on one line, which a commit then takes into content/forge/renders.json. A run is asked for by a push that changes
# tools/lattice/render-request.txt on a branch other than main (on main it runs only by hand); the file names the
# foes on its first line. A first line `publish-from <run id>` renders nothing: the publish job lays in that earlier
# run's pictures (its `lattice-*` artifacts, while they are kept; only a run of this workflow on this repository's
# own push or by hand) over the tables as published now, which are those main's content/forge/renders.json names.
on:
  push:
    # Never on main, where it runs only by hand: merging a branch that asked for a run must not start one there.
    branches-ignore: [main]
    paths:
      - tools/lattice/render-request.txt
  workflow_dispatch:
    inputs:
      foes:
        description: 'The foes to render, by name, comma-separated'
        default: 'husk,flicker,idol,ravager,bulwark'
      samples:
        description: 'Cycles samples a pixel'
        default: '32'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      from: ${{ steps.plan.outputs.from }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Plan a job a move
        id: plan
        env:
          FOES: ${{ inputs.foes }}
        run: |
          foes=${FOES:-$(head -n 1 tools/lattice/render-request.txt)}
          case "$foes" in
            publish-from\ *)
              from=${foes#publish-from }
              [[ "$from" =~ ^[0-9]+$ ]] || { echo "::error::publish-from wants a run's number, not '$from'"; exit 1; }
              echo "from=$from" >> "$GITHUB_OUTPUT" ;;
            *) echo "jobs=$(python3 -I tools/lattice/jobs.py "$foes")" >> "$GITHUB_OUTPUT" ;;
          esac

  # No token here: the renders read only the forge's public tables.
  render:
    needs: plan
    if: needs.plan.outputs.from == ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install Blender's module
        run: |
          pip install --require-hashes --only-binary=:all: -r tools/lattice/requirements.txt
      - name: Check the publisher lays renders in
        if: matrix.foe == 'wave'
        run: python -I tools/test_forge_lattice.py
      - name: Pull the forge's tables
        run: python -I tools/forge_publish.py pull
      - name: Render ${{ matrix.move }}
        working-directory: tools/forge
        env:
          FOE: ${{ matrix.foe }}
          MOVE: ${{ matrix.move }}
          SAMPLES: ${{ inputs.samples || '32' }}
        run: |
          start=$(date +%s)
          if [ "$FOE" = wave ]; then
            python -I ../lattice/wave.py --samples "$SAMPLES" --out "$RUNNER_TEMP/lattice/$MOVE"
          else
            python -I ../lattice/render.py --enemy "$FOE" --anims "$MOVE" --samples "$SAMPLES" \
              --out "$RUNNER_TEMP/lattice/$MOVE"
          fi
          echo "::notice::$MOVE rendered in $(( $(date +%s) - start )) s"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lattice-${{ matrix.move }}
          path: ${{ runner.temp }}/lattice/${{ matrix.move }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, render]
    # After the renders, or with none when it publishes an earlier run's.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.render.result == 'success' || needs.plan.outputs.from != '') }}
    runs-on: ubuntu-latest
    # Reading another run's artifacts needs the run's own token to read the repository's actions.
    permissions:
      contents: read
      actions: read
    # It publishes the same tables as the forge workflow: its publishing waits for theirs, and theirs for it.
    concurrency:
      group: forge
      cancel-in-progress: false
    timeout-minutes: 30
    # The token reaches only the two steps that check it and publish; what they import is installed as the exact
    # wheels the requirements name by their hashes, and the checkout keeps no git credential.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Check the token is set
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::the repository has no CLOUDFLARE_TOKEN secret: nothing is published"; fi
      - name: Install the publisher's packages
        if: steps.token.outputs.set == 'true'
        run: |
          pip install --require-hashes --only-binary=:all: -r tools/lattice/requirements.txt
      # Any workflow run in the repository can upload `lattice-*` artifacts, a fork's pull request's among them: only
      # this workflow's own, run here by a push or by hand, are laid in.
      - name: Check the earlier run is this workflow's own
        if: steps.token.outputs.set == 'true' && needs.plan.outputs.from != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ needs.plan.outputs.from }}
          REPOSITORY: ${{ github.repository }}
        run: |
          run=$(gh api "repos/$REPOSITORY/actions/runs/$FROM" --jq '[.path, .event, .head_repository.full_name] | join(" ")')
          case "$run" in
            ".github/workflows/lattice.yml push $REPOSITORY" | ".github/workflows/lattice.yml workflow_dispatch $REPOSITORY") ;;
            *) echo "::error::run $FROM is not this repository's lattice workflow ($run)"; exit 1 ;;
          esac
      # The tables as published now are those main's manifest names, whatever this branch's checkout holds.
      - name: Start from main's manifest
        if: steps.token.outputs.set == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' "repos/$REPOSITORY/contents/content/forge/renders.json?ref=main" \
            > content/forge/renders.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.token.outputs.set == 'true' && needs.plan.outputs.from == ''
        with:
          pattern: lattice-*
          path: ${{ runner.temp }}/lattice
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.token.outputs.set == 'true' && needs.plan.outputs.from != ''
        with:
          pattern: lattice-*
          path: ${{ runner.temp }}/lattice
          run-id: ${{ needs.plan.outputs.from }}
          github-token: ${{ github.token }}
      # The published tables first, then the Lattice laid in, then its pictures beside what is published.
      - name: Publish them
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          python -I tools/forge_publish.py pull
          python -I tools/forge_publish.py lattice "$RUNNER_TEMP"/lattice/lattice-*
          python -I tools/forge_publish.py add
          node -p "JSON.stringify(require('./content/forge/renders.json'))"
