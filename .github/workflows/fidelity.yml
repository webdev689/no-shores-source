name: fidelity

# A pull request that changes a decision carries, in its description under "## Fidelity review", the verdict of a
# review of it against the owner's words (tools/claude-toolkit/workers/fidelity-review.sh), so no decision merges
# unreviewed. Editing the description runs the check again.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths: ['bible/05-Decisions/**']

permissions: {}

jobs:
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The description carries a fidelity review
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          section=$(printf '%s\n' "$BODY" | tr -d '\r' | awk '/^## Fidelity review/ { inside = 1; next } /^## / { inside = 0 } inside')
          if ! printf '%s\n' "$section" | grep -q '^Verdict: '; then
            echo '::error::This pull request changes a decision. Run tools/claude-toolkit/workers/fidelity-review.sh and put its "Verdict:" line, with its findings fixed or answered, in the description under "## Fidelity review".'
            exit 1
          fi
          printf '%s\n' "$section" | grep '^Verdict: '
