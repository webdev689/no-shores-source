name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Every other run has a group of its own, so none on main is
# cancelled and each merge is checked before it is published.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # On a push to main, whether its merge is code its pull request's check already passed: main before the merge is in
  # the pull request's head, so the merge is that head's code, which the check passed merged with an older main that
  # held nothing it lacks. Then main deploys without checking it again; on any doubt, or an error here, it is checked.
  earlier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - name: Find whether the pull request's check passed this code
        id: find
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
          read -r main head more <<< "$(api "commits/$GITHUB_SHA" '.parents | map(.sha) | join(" ")')"
          passed=no
          if [ -n "${head:-}" ] && [ -z "${more:-}" ] && [ "$(api "compare/$main...$head" .behind_by)" = 0 ]; then
            for run in $(api "commits/$head/check-runs?check_name=check" \
              '.check_runs[] | select(.conclusion == "success") | .details_url | capture("/runs/(?<id>[0-9]+)/").id'); do
              if [ "$(api "actions/runs/$run" '.path + " " + .event')" = ".github/workflows/ci.yml pull_request" ]; then
                passed=yes
              fi
            done
          fi
          echo "the merge of $head into $main: passed $passed"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  # The check in its three parts, side by side, each on a runner of its own (`cargo xtask check <part>`): every part
  # runs to its end, so one run shows each part's failures.
  part:
    needs: earlier
    if: ${{ !cancelled() && needs.earlier.outputs.passed != 'yes' }}
    name: check (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [rest, rust, page]
    runs-on: ubuntu-latest
    # The longest part runs about 25 minutes on a hosted runner; the limit stops only a hung one.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.part }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install the TypeScript tools
        run: npm ci
      # cargo-nextest, which runs every crate's tests at once, as its release built it, checked against its hash.
      - name: Install cargo-nextest
        if: matrix.part == 'rust'
        run: |
          set -euo pipefail
          release="cargo-nextest-0.9.152"
          curl -sSfLo "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/$release/$release-x86_64-unknown-linux-gnu.tar.gz"
          echo "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a  $RUNNER_TEMP/nextest.tar.gz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin"
      # The island packs the committed manifest names, for the test that reads every kit's: each is checked against
      # the hash its key is named by.
      - name: Fetch the island packs
        if: matrix.part == 'page'
        run: |
          set -euo pipefail
          packs="$RUNNER_TEMP/island-modules"
          mkdir -p "$packs"
          base=$(jq -r .base content/islands/modules.json)
          jq -r '.kits | to_entries[] | "\(.key) \(.value)"' content/islands/modules.json | while read -r kit key; do
            curl -sSfo "$packs/$kit.modules" "$base$key"
            echo "$(basename "$key" .modules)  $packs/$kit.modules" | sha256sum -c --quiet -
          done
          echo "ISLAND_MODULES=$packs" >> "$GITHUB_ENV"
      - name: cargo xtask check ${{ matrix.part }}
        run: cargo xtask check ${{ matrix.part }}
      # How the Lattice's renders lay into the forge's tables, on the runner's own Python: the wave's frame-cutting
      # test needs Pillow, so it runs in the Lattice workflow, which installs it.
      - name: Check the forge publisher lays the Lattice in
        if: matrix.part == 'rest'
        run: python3 -I tools/test_forge_lattice.py MergeFoe

  # The one check a merge waits on and the deploys follow: every part passed, or main's merge is code its pull request's
  # check passed.
  check:
    needs: [earlier, part]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed, or the pull request's check did
        env:
          EARLIER: ${{ needs.earlier.outputs.passed }}
          PARTS: ${{ needs.part.result }}
        run: |
          echo "passed on the pull request: ${EARLIER:-no}; the parts here: $PARTS"
          [ "$EARLIER" = yes ] || [ "$PARTS" = success ]

  # Publishes to GitHub Pages from main, once this same commit has passed the check and the rooms have deployed or
  # had nothing to, so no page is published on a protocol no room speaks. A called workflow's jobs get at most what
  # its caller grants; inside, only the deploy job takes the write and the identity token.
  pages:
    needs: [check, rooms]
    if: >-
      !cancelled() && needs.check.result == 'success' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.rooms.outputs.deploy == 'no' || needs.rooms.outputs.deployed == 'yes')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      rooms_deployed: ${{ needs.rooms.outputs.deployed == 'yes' }}

  # Serves the website and the game at noshores.online from Cloudflare, on the page's terms: from main, once this same
  # commit has passed the check and the rooms have deployed or had nothing to.
  site:
    needs: [check, rooms]
    if: >-
      !cancelled() && needs.check.result == 'success' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.rooms.outputs.deploy == 'no' || needs.rooms.outputs.deployed == 'yes')
    # A called workflow's jobs get at most what its caller grants: the site's deploy reads checks when run by hand, and
    # the merged pull requests' patch notes.
    permissions:
      contents: read
      checks: read
      pull-requests: read
    uses: ./.github/workflows/site.yml
    with:
      rooms_deployed: ${{ needs.rooms.outputs.deployed == 'yes' }}
    secrets: inherit

  # Deploys the rooms from main, once this same commit has passed the check, when their code changed: the owner's yes
  # to a merge covers it. Reading the deployments tells it what was deployed last, and reading the checks whether a
  # commit run by hand passed.
  rooms:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      deployments: read
      checks: read
    uses: ./.github/workflows/rooms.yml
    secrets: inherit

  # Releases the desktop app from main, once this same commit has passed the check, when what its installers are built
  # from changed: the owner's yes to a merge covers it. Reading the deployments tells it what was released last.
  desktop:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      deployments: read
      checks: read
    uses: ./.github/workflows/desktop.yml
    with:
      release: true
    secrets: inherit

  # Deploys the Discord bot from main, once this same commit has passed the check, when its code changed: the owner's
  # yes to a merge covers it. It waits on the rooms' workflow, which deploys the accounts its service binding names.
  bot:
    needs: [check, rooms]
    if: >-
      !cancelled() && needs.check.result == 'success' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      deployments: read
      checks: read
    uses: ./.github/workflows/bot.yml
    secrets: inherit
