name: wreck

# Builds the prologue's wreck in Blender from the Brig, the Frigate and the Sloop, bakes its fires' and the sky's light
# at full size, and publishes its mesh, its light and its model to R2 whenever the wreck's tools change: the job that
# builds holds no secret and stages them, and a second job, which only uploads them, holds the repository's R2 token.
# R2's objects are named by their hashes, so a run changes nothing already published. The build's last line names the
# three keys and the level's hash, and the run keeps the content/prologue/wreck.json it wrote (artifact wreck-level):
# a build on another machine can lay its ground a hair differently, so a commit takes that file whole once the run
# has published, its level with its keys, and the mesh and the ground the game walks agree (export_wreck.py).
on:
  push:
    paths: [tools/wreck/**, .github/workflows/wreck.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Installs others' code (pip, npm), so it holds no secret: what it stages for R2 goes on as an artifact.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      staged: ${{ steps.staged.outputs.staged }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install Blender's module and the TypeScript tools
        run: pip install bpy==5.3.0 numpy && npm ci
      # The Sloop's published source, checked against the hash its key names before Blender opens it, shaped to three
      # times its size as the ships workflow shapes her, and the game's pictures the wreck is painted with.
      - name: Fetch the Sloop and make the pictures
        run: |
          key=$(node -p "require('./content/ships/ships.json').ships.sloop.source")
          base=$(node -p "require('./content/ships/ships.json').base")
          curl -sSfo "$RUNNER_TEMP/sloop.blend" "$base$key"
          echo "$(basename "$key" .blend)  $RUNNER_TEMP/sloop.blend" | sha256sum -c --quiet -
          node tools/ships/ship_pictures.ts "$RUNNER_TEMP/pictures.bin"
          python -I tools/ships/shape_ship.py -- "$RUNNER_TEMP/sloop.blend" "$RUNNER_TEMP/shaped.blend" --scale 3
      - name: Build and light the wreck
        run: |
          python -I tools/wreck/build_wreck.py "$RUNNER_TEMP/Wreck.blend" --sloop "$RUNNER_TEMP/sloop.blend" \
            --shaped "$RUNNER_TEMP/shaped.blend" --pictures "$RUNNER_TEMP/pictures.bin"
          python -I tools/wreck/light_wreck.py -- "$RUNNER_TEMP/Wreck.blend" "$RUNNER_TEMP/WreckLit.blend" \
            "$RUNNER_TEMP/light.png" --size 2048 --samples 96
      - name: Export and stage the wreck
        env:
          R2_STAGE: ${{ runner.temp }}/stage
        run: python -I tools/wreck/export_wreck.py -- "$RUNNER_TEMP/WreckLit.blend" "$RUNNER_TEMP/light.png"
      - name: Keep the level it laid
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wreck-level
          path: content/prologue/wreck.json
      - name: Say whether anything is staged
        id: staged
        run: if [ -d "$RUNNER_TEMP/stage" ]; then echo "staged=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.staged.outputs.staged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r2-stage
          path: ${{ runner.temp }}/stage
          retention-days: 1

  # A fresh machine with nothing installed, and the only job that holds the token: tools/r2.py uploads the stage's
  # files, each only if it is named by its own hash under a folder a publisher writes.
  publish:
    needs: build
    if: needs.build.outputs.staged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: r2-stage
          path: ${{ runner.temp }}/stage
      # Without the token there is nothing to publish with: the run says so and stops, rather than failing.
      - name: Check the token is set
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::the repository has no R2_TOKEN secret: nothing is published"; fi
      - name: Upload what the build staged
        if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_TOKEN }}
        run: python3 -I tools/r2.py upload "$RUNNER_TEMP/stage"
