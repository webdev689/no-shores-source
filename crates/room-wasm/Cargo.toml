[package]
name = "room-wasm"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The room for its Cloudflare host: the room and its messages behind a small WebAssembly door, bytes in and bytes out."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
combat = { path = "../combat" }
land = { path = "../land" }
movement = { path = "../movement" }
protocol = { path = "../protocol" }
room = { path = "../room" }
world = { path = "../world" }
serde.workspace = true
serde_json.workspace = true

# Only to test that a node's file the bake writes is the file the room reads.
[dev-dependencies]
bake = { path = "../bake" }
city = { path = "../city" }

[lints]
workspace = true
