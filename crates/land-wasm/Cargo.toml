[package]
name = "land-wasm"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The land for the browser: the land crate behind a small WebAssembly door, its heights handed over as bytes, its city settled on it, and a ship sailed over it."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bake = { path = "../bake" }
city = { path = "../city" }
land = { path = "../land" }
layout = { path = "../layout" }
naval = { path = "../naval" }
sailing = { path = "../sailing" }
sky = { path = "../sky" }
world = { path = "../world" }
serde_json.workspace = true

[lints]
workspace = true
