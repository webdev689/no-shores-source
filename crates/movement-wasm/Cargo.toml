[package]
name = "movement-wasm"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Movement for the browser: the movement crate behind a small WebAssembly door, a body stepped one tick at a time on a course and a window of the land."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
