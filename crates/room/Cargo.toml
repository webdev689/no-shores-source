[package]
name = "room"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A shared space on the server: its players, each player's inputs taken in order, their bodies stepped tick by tick on its ground and judged against its section; the sea's ships sailing their courses among its hostiles; and a fleet's ships sailed by their helms and fighting at true scale."

[dependencies]
gear = { path = "../gear" }
isle = { path = "../isle" }
combat = { path = "../combat" }
dungeon = { path = "../dungeon" }
passage = { path = "../passage" }
foes = { path = "../foes" }
land = { path = "../land" }
libm.workspace = true
movement = { path = "../movement" }
naval = { path = "../naval" }
navmesh = { path = "../navmesh" }
reach = { path = "../reach" }
sailing = { path = "../sailing" }
sky = { path = "../sky" }
world = { path = "../world" }

[dev-dependencies]
bake = { path = "../bake" }
layout = { path = "../layout" }
city = { path = "../city" }
serde_json.workspace = true

[lints]
workspace = true
