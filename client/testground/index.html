<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Test Ground</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          13px system-ui,
          sans-serif;
        color: #e8e8e8;
        background: #0b0d10;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 320px 1fr;
      }
      #panel {
        overflow-y: auto;
        padding: 12px 14px;
        background: #14181d;
        border-right: 1px solid #2a3038;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #9aa4b0;
        margin: 16px 0 6px;
      }
      .hint,
      .status {
        color: #9aa4b0;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 4px 0;
      }
      .row > span:first-child {
        min-width: 92px;
      }
      .row select,
      .row input[type='range'] {
        flex: 1;
        min-width: 0;
      }
      .figures {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 6px;
      }
      .gear {
        max-height: 320px;
        overflow-y: auto;
        border: 1px solid #2a3038;
        border-radius: 4px;
        padding: 2px 6px;
        margin-top: 6px;
      }
      .gear .row {
        margin: 1px 0;
      }
      .gear .row > span:first-child {
        min-width: 0;
      }
      button {
        background: #222a33;
        color: inherit;
        border: 1px solid #36404c;
        border-radius: 4px;
        padding: 5px 8px;
        margin: 2px 4px 2px 0;
        cursor: pointer;
        text-align: left;
      }
      button.active {
        background: #3b5b7d;
        border-color: #6f9fd1;
      }
      input[type='search'] {
        width: 100%;
        box-sizing: border-box;
      }
      main {
        position: relative;
      }
      #ground {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        font-weight: 600;
        text-shadow: 0 1px 2px #000;
      }
      #hud .own {
        position: absolute;
        left: 16px;
        bottom: 16px;
        width: 240px;
        display: grid;
        gap: 4px;
      }
      #hud .bar {
        height: 8px;
        background: #0008;
        border: 1px solid #000a;
      }
      #hud .bar .fill {
        height: 100%;
        width: 100%;
      }
      #hud .health .fill {
        background: #b8322d;
      }
      #hud .stamina .fill {
        background: #3fa35b;
      }
      #hud .poise .fill {
        background: #d9a93a;
      }
      #hud .own .poise {
        height: 4px;
      }
      #hud .stamina.flash {
        border-color: #fff;
        box-shadow: 0 0 8px #fff;
        animation: blink 0.15s steps(2) infinite;
      }
      @keyframes blink {
        50% {
          background: #fff4;
        }
      }
      #hud .hurt {
        position: absolute;
        inset: 0;
        opacity: 0;
        box-shadow: inset 0 0 90px 24px #c41a12;
      }
      #hud .target {
        position: absolute;
        top: 16px;
        left: 50%;
        width: 320px;
        margin-left: -160px;
        display: grid;
        gap: 3px;
        text-align: center;
      }
      #hud .target .poise {
        height: 4px;
      }
      #hud .mark {
        position: absolute;
        left: -6px;
        top: -6px;
        width: 12px;
        height: 12px;
        border: 2px solid #f4e3b0;
        border-radius: 50%;
        box-shadow: 0 0 6px #f4e3b0;
      }
      #hud .over > * {
        position: absolute;
        left: 0;
        top: 0;
      }
      #hud .bar.small {
        width: 48px;
        height: 4px;
        margin-left: -24px;
      }
      #hud .word {
        white-space: nowrap;
        translate: -50% 0;
        font-size: 15px;
        padding: 1px 7px;
        border-radius: 4px;
        background: #000b;
        text-shadow: none;
      }
      #hud .word.dealt {
        color: #f2f2f2;
      }
      #hud .word.taken {
        color: #ff7468;
      }
      #hud .word.great {
        color: #ffd95a;
        font-size: 18px;
      }
      #hud .word.good {
        color: #ffd95a;
      }
      #hud .word.warn {
        color: #fff;
        font-size: 18px;
        background: #a0140ccc;
        border: 2px solid #fff;
      }
      #hud .word.plain {
        color: #bfc8d2;
      }
      #hud .arrow {
        width: 0;
        height: 0;
        margin: -12px 0 0 -10px;
        border-top: 12px solid transparent;
        border-bottom: 12px solid transparent;
        border-left: 22px solid #ff5a4a;
        transform-origin: 10px 12px;
        filter: drop-shadow(0 0 2px #000) drop-shadow(0 0 2px #000);
      }
      #hud .veil {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #300a;
        font-size: 22px;
      }
      #hud [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <aside id="panel"></aside>
    <main>
      <canvas id="ground"></canvas>
      <div id="hud"></div>
    </main>
    <script type="module" src="/src/testground/testgroundMain.ts"></script>
  </body>
</html>
