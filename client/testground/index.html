<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Test Ground</title>
    <link rel="stylesheet" href="/src/face.css" />
    <style>
      :root {
        color-scheme: dark;
        color: #e8e8e8;
        background: #0b0d10;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        /* The panels narrow on a smaller screen, so the view between them keeps room for the fight's display. */
        grid-template-columns: clamp(220px, 22vw, 320px) 1fr clamp(240px, 24vw, 360px);
      }
      #panel,
      #gear-panel {
        overflow-y: auto;
        padding: 12px 14px;
        background: #14181d;
        border-right: 1px solid #2a3038;
      }
      #gear-panel {
        border-right: none;
        border-left: 1px solid #2a3038;
      }
      .kit-item {
        margin: 8px 0;
        padding-bottom: 6px;
        border-bottom: 1px solid #222a33;
      }
      .kit-item > span {
        color: #fff;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: round(up, calc(3em / 22), 1px);
        color: #9aa4b0;
        margin: 16px 0 6px;
      }
      .hint,
      .status {
        color: #9aa4b0;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 4px 0;
      }
      .row > span:first-child {
        min-width: 92px;
      }
      .row select,
      .row input[type='range'] {
        flex: 1;
        min-width: 0;
      }
      .feel {
        border: 1px solid #2a3038;
        border-radius: 4px;
        padding: 2px 8px;
        margin: 6px 0;
      }
      .feel-head > span:first-child {
        font-weight: 600;
      }
      .feel .row:not(.feel-head) > span:first-child {
        min-width: 82px;
        padding-left: 10px;
        color: #b4bcc6;
      }
      .feel .value {
        min-width: 40px;
        text-align: right;
        color: #9aa4b0;
        font-variant-numeric: tabular-nums;
      }
      .feel.off .row:not(.feel-head) {
        opacity: 0.4;
      }
      .figures {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 6px;
      }
      .gear {
        max-height: 320px;
        overflow-y: auto;
        border: 1px solid #2a3038;
        border-radius: 4px;
        padding: 2px 6px;
        margin-top: 6px;
      }
      .gear .row {
        margin: 1px 0;
      }
      .gear .row > span:first-child {
        min-width: 0;
      }
      button {
        background: #222a33;
        color: inherit;
        border: 1px solid #36404c;
        border-radius: 4px;
        padding: 5px 8px;
        margin: 2px 4px 2px 0;
        cursor: pointer;
        text-align: left;
      }
      button.active {
        background: #3b5b7d;
        border-color: #6f9fd1;
      }
      input[type='search'] {
        width: 100%;
        box-sizing: border-box;
      }
      main {
        position: relative;
      }
      #ground {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <aside id="panel"></aside>
    <main>
      <canvas id="ground"></canvas>
    </main>
    <aside id="gear-panel"></aside>
    <script type="module" src="/src/testground/testgroundMain.ts"></script>
  </body>
</html>
