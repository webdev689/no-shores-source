<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Test Ground</title>
    <style>
      /* One canvas fills the page: the view and the panels either side of it are drawn by the game. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        overflow: hidden;
      }
      #ground {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="ground" role="application" aria-label="Test Ground"></canvas>
    <script type="module" src="/src/testground/testgroundMain.ts"></script>
  </body>
</html>
