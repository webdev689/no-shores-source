<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Overlook</title>
    <link rel="stylesheet" href="/src/face.css" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2efe6;
        --dim: rgba(242, 239, 230, 0.68);
        --panel: rgba(10, 13, 17, 0.72);
        --warn: #f0b545;
        --dead: #d8574a;
        --gold: #f3cf6a;
        /* Words laid straight on the world: a hard 1 px outline all round and a soft shade past it, as the fight's
           plates and the ships' write theirs, so they read over cloud and glare. */
        --halo:
          1px 0 0 #050608, -1px 0 0 #050608, 0 1px 0 #050608, 0 -1px 0 #050608, 1px 1px 0 #050608, -1px -1px 0 #050608,
          1px -1px 0 #050608, -1px 1px 0 #050608, 0 0 4px rgba(0, 0, 0, 0.6);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        transition: filter 1.4s ease-out;
      }
      /* In death the world drains to grey, and comes back in colour on respawn. */
      canvas.dead {
        filter: grayscale(0.92) brightness(0.72) contrast(1.05);
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: var(--ink);
        text-shadow: 1px 1px 0 #000;
      }
      /* The heads-up display wears the Enhanced Plus kit (client/src/plus/), which paints each surface by its role;
         this sheet gives each its room, and each window and press the 2 px border the kit's frame lands on. A rule here
         that outranks the kit's sets a border's width and style only, never its colour. */
      #hud button {
        pointer-events: auto;
        font: inherit;
        border-width: 2px;
        border-style: solid;
        border-radius: 0;
        padding: 7px 14px;
        cursor: pointer;
        text-shadow: 1px 1px 0 #000;
      }
      #hud button:disabled {
        cursor: default;
      }
      [hidden] {
        display: none !important;
      }
      /* The place's name keeps left of the compass, 520 px wide or 60% of a narrower screen, at the top's middle. */
      .place {
        position: absolute;
        left: 28px;
        top: 22px;
        max-width: calc(50vw - min(260px, 30vw) - 40px);
        text-shadow: var(--halo);
      }
      .place .title {
        font-size: 22px;
        letter-spacing: round(up, calc(1em / 22), 1px);
        font-weight: 500;
      }
      /* Small words over the sky and the ground are outlined in black, so they read on either. */
      .place .kind,
      .hints {
        text-shadow:
          -1px 0 #000,
          1px 0 #000,
          0 -1px #000,
          0 1px #000;
      }
      .place .kind {
        margin-top: 2px;
        font-size: 11px;
        letter-spacing: round(up, calc(3em / 22), 1px);
        text-transform: uppercase;
        color: var(--ink);
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 35%, #000 100%);
        transition: opacity 0.4s;
      }
      /* Under the compass's column: the compass, a boss's bar and the target's plate. */
      .warning {
        position: absolute;
        left: 0;
        right: 0;
        top: max(18%, 180px);
        text-align: center;
        color: var(--warn);
      }
      .warning-words {
        font-size: 22px;
        letter-spacing: round(up, calc(5em / 22), 1px);
        text-transform: uppercase;
      }
      .warning .count {
        font-size: 66px;
        font-weight: 500;
        line-height: 79px;
      }
      .death {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .death-words {
        font-size: 44px;
        letter-spacing: round(up, calc(5em / 22), 1px);
        text-transform: uppercase;
        color: var(--dead);
      }
      .death-why {
        color: var(--dim);
        margin-bottom: 10px;
      }
      .hints {
        position: absolute;
        left: 28px;
        bottom: 22px;
        font-size: 11px;
        line-height: 19px;
        color: var(--ink);
        text-shadow: var(--halo);
      }
      /* On a screen past 1440p the HUD's words stand at twice their size, as the menu does. */
      @media (min-width: 2400px) and (min-height: 1300px) {
        .place,
        .hints {
          zoom: 2;
        }
      }
      #hud:has(> .sea-bar:not([hidden])) .hints {
        bottom: 96px;
      }
      /* The offer to dock or go ashore stands over the sea bar, where the hints would run into it. */
      #hud:has(> .sea-bar:not([hidden])):has(> .landfall:not([hidden])) .hints {
        bottom: 148px;
      }
      /* On foot the hints stand over the fight's vitals panel, 126 px tall from the screen's foot. */
      #hud:has(> .fight:not([hidden])) .hints {
        bottom: 140px;
      }
      /* Where the HUD is wide and not yet doubled, the hints stand at the face's next step, over the vitals and the
         buffs above them, which grow there too. */
      @media (min-width: 1500px) and (max-width: 2399.98px) and (min-height: 900px),
        (min-width: 2400px) and (min-height: 900px) and (max-height: 1299.98px) {
        .hints {
          font-size: 22px;
          line-height: 33px;
        }
        #hud:has(> .fight:not([hidden])) .hints {
          bottom: 198px;
        }
      }
      /* On foot the fight's display holds the compass; the game's own is the sea's. */
      #hud:has(> .fight:not([hidden])) > .compass-column {
        display: none;
      }
      /* A boss's bar under the compass takes the top from the place's name while it shows. */
      #hud:has(> .fight.bossed:not([hidden])) .place {
        visibility: hidden;
      }
      /* At sea the line stands under the compass. */
      .status {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 56px;
        padding: 6px 14px;
        border: 2px solid transparent;
        white-space: nowrap;
        text-shadow: 1px 1px 0 #000;
      }
      /* On foot the fight's column holds the top's middle, so the line stands under the place's name, and under a
         boss's bar while one shows. */
      #hud:has(> .fight:not([hidden])) .status {
        left: 28px;
        top: 84px;
        transform: none;
      }
      #hud:has(> .fight.bossed:not([hidden])) .status {
        top: 114px;
      }
      /* In a fight at sea the ships' plates hold the top, a Boss's under the compass: the line stands under it, and
         the place's name gives way. */
      #hud:has(> svg:not(:empty)) .status {
        top: 114px;
      }
      #hud:has(> svg:not(:empty)) .place {
        visibility: hidden;
      }
      .sea-bar {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        width: max-content;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 8px 14px;
        border: 2px solid transparent;
        text-shadow: 1px 1px 0 #000;
      }
      .sea-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sea-group + .sea-group {
        padding-left: 18px;
        border-left-width: 1px;
        border-left-style: solid;
      }
      .sea-bar .pace-label {
        font-size: 11px;
        letter-spacing: round(up, calc(3em / 22), 1px);
        text-transform: uppercase;
        color: var(--dim);
      }
      .sea-bar .pace {
        min-width: 44px;
        text-align: center;
        font-size: 22px;
        font-weight: 500;
      }
      #hud .landfall {
        position: absolute;
        left: 50%;
        bottom: 94px;
        transform: translateX(-50%);
        padding: 10px 18px;
        font-size: 11px;
      }
      .menu {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 240px;
        padding: 20px 22px;
        border: 2px solid transparent;
        text-shadow: 1px 1px 0 #000;
      }
      .menu-title {
        font-size: 11px;
        letter-spacing: round(up, calc(3em / 22), 1px);
        text-transform: uppercase;
        color: var(--dim);
        margin: -20px -22px 6px;
        padding: 12px 22px 10px;
        border-bottom: 1px solid transparent;
      }
      .ship-panel {
        position: absolute;
        right: 28px;
        top: 84px;
        width: 300px;
        padding: 0 18px 0;
        border: 2px solid transparent;
        text-shadow: 1px 1px 0 #000;
        pointer-events: auto;
      }
      .ship-title {
        margin: 0 -18px 4px;
        padding: 12px 18px 10px;
        font-size: 22px;
        letter-spacing: round(up, calc(1em / 22), 1px);
        font-weight: 500;
        border-bottom: 1px solid transparent;
      }
      .ship-part {
        padding: 8px 0 4px;
      }
      .ship-part-heading {
        margin-bottom: 6px;
        padding-bottom: 4px;
        font-size: 11px;
        letter-spacing: round(up, calc(3em / 22), 1px);
        text-transform: uppercase;
        color: var(--dim);
        border-bottom: 1px solid transparent;
      }
      .ship-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 2px 0;
      }
      .ship-label {
        color: var(--dim);
      }
      .ship-value {
        text-align: right;
      }
      .ship-later {
        display: inline-block;
        padding: 2px 10px;
        font-size: 11px;
        letter-spacing: round(up, calc(3em / 22), 1px);
        border: 2px solid transparent;
        color: var(--dim);
      }
      .ship-footer {
        margin: 10px -18px 0;
        padding: 10px 18px 12px;
        border-top: 1px solid transparent;
      }
      .ship-footer button {
        width: 100%;
      }
      .menu button {
        text-align: left;
        font-size: 22px;
      }
      .marks {
        position: absolute;
        inset: 0;
      }
      /* The held map's card, laid over the parchment the GPU draws; its words and marks are painted with its ink. */
      .held-map {
        position: absolute;
        inset: 0;
        pointer-events: none;
        --map-ink: #3a2816;
        --map-route: #781c14;
      }
      .held-map > * {
        position: absolute;
        left: 0;
        top: 0;
      }
      .held-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 14px;
        background: var(--panel);
        border: 1px solid var(--gold);
        border-radius: 4px;
        white-space: nowrap;
        text-shadow: none;
      }
      .held-card button {
        pointer-events: auto;
      }
      .mark {
        --size: 28px;
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        padding: 0 !important;
        border: none !important;
        background: none !important;
        overflow: visible;
      }
      .mark .glyph {
        position: absolute;
        left: calc(var(--size) / -2);
        top: calc(var(--size) / -2);
        width: var(--size);
        height: var(--size);
        display: grid;
        place-items: center;
        font-size: max(11px, round(down, calc(var(--size) / 2), 11px));
        border-radius: 50%;
        background: rgba(10, 13, 17, 0.6);
        border: 2px solid var(--kind, var(--ink));
        color: var(--kind, var(--ink));
      }
      .mark .name,
      .mark .note {
        position: absolute;
        left: 0;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .mark .name {
        top: calc(var(--size) / 2 + 4px);
        font-weight: 500;
      }
      .mark .note {
        top: calc(var(--size) / 2 + 22px);
        font-size: 11px;
        color: var(--dim);
      }
      .mark .arrow {
        position: absolute;
        left: -6px;
        top: -6px;
        width: 12px;
        height: 12px;
        font-size: 11px;
        line-height: 12px;
        text-align: center;
        color: var(--kind, var(--ink));
        transform-origin: 6px 6px;
      }
      .mark.held .note,
      .mark.unnamed .name,
      .mark.unnamed .note {
        display: none;
      }
      .mark:hover .glyph {
        background: rgba(30, 36, 44, 0.85);
      }
      .mark.chosen .glyph {
        border-color: var(--gold);
        box-shadow:
          0 0 0 3px rgba(243, 207, 106, 0.35),
          0 0 18px rgba(243, 207, 106, 0.6);
      }
      .mark.chosen .name {
        color: var(--gold);
      }
      .mark.social {
        --kind: #f3cf6a;
      }
      .mark.patrol {
        --kind: #8ed081;
      }
      .mark.mission {
        --kind: #7fb4ee;
      }
      .mark.dungeon {
        --kind: #c193e6;
      }
      .mark.boss {
        --kind: #ee7c6e;
      }
      .mark.port {
        --kind: #e8e4d6;
      }
      .veil {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #05070a;
        opacity: 0;
        transition: opacity 0.7s;
        pointer-events: none;
      }
      .veil.shown {
        opacity: 1;
        pointer-events: auto;
      }
      .veil-text {
        font-size: 22px;
        letter-spacing: round(up, calc(5em / 22), 1px);
        text-transform: uppercase;
        color: var(--dim);
        animation: breathe 2.4s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .veil-text {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
