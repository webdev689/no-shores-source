<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Overlook</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2efe6;
        --dim: rgba(242, 239, 230, 0.68);
        --panel: rgba(10, 13, 17, 0.72);
        --line: rgba(242, 239, 230, 0.22);
        --warn: #f0b545;
        --dead: #d8574a;
        --gold: #f3cf6a;
        font:
          14px system-ui,
          sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        transition: filter 1.4s ease-out;
      }
      /* In death the world drains to grey, as Destiny's does, and comes back in colour on respawn. */
      canvas.dead {
        filter: grayscale(0.92) brightness(0.72) contrast(1.05);
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: var(--ink);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
      }
      #hud button {
        pointer-events: auto;
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 7px 14px;
        cursor: pointer;
        text-shadow: none;
      }
      #hud button:hover:not(:disabled) {
        border-color: var(--gold);
      }
      #hud button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      [hidden] {
        display: none !important;
      }
      .place {
        position: absolute;
        left: 28px;
        top: 22px;
      }
      .place .title {
        font-size: 26px;
        letter-spacing: 0.04em;
        font-weight: 600;
      }
      .place .kind {
        margin-top: 2px;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 35%, #000 100%);
        transition: opacity 0.4s;
      }
      .warning {
        position: absolute;
        left: 0;
        right: 0;
        top: 18%;
        text-align: center;
        color: var(--warn);
      }
      .warning-words {
        font-size: 22px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .warning .count {
        font-size: 64px;
        font-weight: 600;
        line-height: 1.2;
      }
      .death {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .death-words {
        font-size: 44px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--dead);
      }
      .death-why {
        color: var(--dim);
        margin-bottom: 10px;
      }
      .hints {
        position: absolute;
        left: 28px;
        bottom: 22px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--dim);
      }
      .status {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 24px;
        padding: 6px 14px;
        background: var(--panel);
        border-radius: 3px;
        white-space: nowrap;
        text-shadow: none;
      }
      .sea-bar {
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        text-shadow: none;
      }
      .sea-bar .pace-label {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .sea-bar .pace {
        min-width: 44px;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
      }
      .sea-bar .landings {
        margin-left: 10px;
        border-color: var(--gold);
      }
      .menu {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 240px;
        padding: 20px 22px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        text-shadow: none;
      }
      .menu-title {
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
        margin-bottom: 6px;
      }
      .menu button {
        text-align: left;
        font-size: 15px;
      }
      .marks {
        position: absolute;
        inset: 0;
      }
      .mark {
        --size: 28px;
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        padding: 0 !important;
        border: none !important;
        background: none !important;
        overflow: visible;
      }
      .mark .glyph {
        position: absolute;
        left: calc(var(--size) / -2);
        top: calc(var(--size) / -2);
        width: var(--size);
        height: var(--size);
        display: grid;
        place-items: center;
        font-size: calc(var(--size) * 0.5);
        border-radius: 50%;
        background: rgba(10, 13, 17, 0.6);
        border: 2px solid var(--kind, var(--ink));
        color: var(--kind, var(--ink));
      }
      .mark .name,
      .mark .note {
        position: absolute;
        left: 0;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .mark .name {
        top: calc(var(--size) / 2 + 4px);
        font-weight: 600;
      }
      .mark .note {
        top: calc(var(--size) / 2 + 22px);
        font-size: 11px;
        color: var(--dim);
      }
      .mark .arrow {
        position: absolute;
        left: -6px;
        top: -6px;
        width: 12px;
        height: 12px;
        font-size: 10px;
        line-height: 12px;
        text-align: center;
        color: var(--kind, var(--ink));
        transform-origin: 6px 6px;
      }
      .mark.held .note,
      .mark.unnamed .name,
      .mark.unnamed .note {
        display: none;
      }
      .mark:hover .glyph {
        background: rgba(30, 36, 44, 0.85);
      }
      .mark.chosen .glyph {
        border-color: var(--gold);
        box-shadow:
          0 0 0 3px rgba(243, 207, 106, 0.35),
          0 0 18px rgba(243, 207, 106, 0.6);
      }
      .mark.chosen .name {
        color: var(--gold);
      }
      .mark.social {
        --kind: #f3cf6a;
      }
      .mark.patrol {
        --kind: #8ed081;
      }
      .mark.mission {
        --kind: #7fb4ee;
      }
      .mark.dungeon {
        --kind: #c193e6;
      }
      .mark.boss {
        --kind: #ee7c6e;
      }
      .mark.port {
        --kind: #e8e4d6;
      }
      .veil {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #05070a;
        opacity: 0;
        transition: opacity 0.7s;
        pointer-events: none;
      }
      .veil.shown {
        opacity: 1;
        pointer-events: auto;
      }
      .veil-text {
        font-size: 18px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--dim);
        animation: breathe 2.4s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
