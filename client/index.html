<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Overlook</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2efe6;
        --dim: rgba(242, 239, 230, 0.68);
        --panel: rgba(10, 13, 17, 0.72);
        --warn: #f0b545;
        --dead: #d8574a;
        --gold: #f3cf6a;
        font:
          14px system-ui,
          sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        transition: filter 1.4s ease-out;
      }
      /* In death the world drains to grey, as Destiny's does, and comes back in colour on respawn. */
      canvas.dead {
        filter: grayscale(0.92) brightness(0.72) contrast(1.05);
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: var(--ink);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
      }
      /* The heads-up display wears the Enhanced Plus kit (client/src/plus/), which paints each surface by its role;
         this sheet gives each its room, and each window and press the 2 px border the kit's frame lands on. */
      #hud button {
        pointer-events: auto;
        font: inherit;
        border: 2px solid transparent;
        border-radius: 0;
        padding: 7px 14px;
        cursor: pointer;
        text-shadow: 1px 1px 0 #000;
      }
      #hud button:disabled {
        cursor: default;
      }
      [hidden] {
        display: none !important;
      }
      .place {
        position: absolute;
        left: 28px;
        top: 22px;
      }
      .place .title {
        font-size: 26px;
        letter-spacing: 0.04em;
        font-weight: 600;
      }
      .place .kind {
        margin-top: 2px;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 35%, #000 100%);
        transition: opacity 0.4s;
      }
      .warning {
        position: absolute;
        left: 0;
        right: 0;
        top: 18%;
        text-align: center;
        color: var(--warn);
      }
      .warning-words {
        font-size: 22px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .warning .count {
        font-size: 64px;
        font-weight: 600;
        line-height: 1.2;
      }
      .death {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .death-words {
        font-size: 44px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--dead);
      }
      .death-why {
        color: var(--dim);
        margin-bottom: 10px;
      }
      .hints {
        position: absolute;
        left: 28px;
        bottom: 22px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--dim);
      }
      #hud:has(> .sea-bar:not([hidden])) .hints {
        bottom: 96px;
      }
      .status {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 24px;
        padding: 6px 14px;
        border: 2px solid transparent;
        white-space: nowrap;
        text-shadow: 1px 1px 0 #000;
      }
      .sea-bar {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        width: max-content;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 8px 14px;
        border: 2px solid transparent;
        text-shadow: 1px 1px 0 #000;
      }
      .sea-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .sea-group + .sea-group {
        padding-left: 18px;
        border-left: 1px solid transparent;
      }
      .sea-bar .pace-label {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .sea-bar .pace {
        min-width: 44px;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
      }
      #hud .landfall {
        position: absolute;
        left: 50%;
        bottom: 94px;
        transform: translateX(-50%);
        padding: 10px 18px;
        font-size: 16px;
      }
      .menu {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 240px;
        padding: 20px 22px;
        border: 2px solid transparent;
        text-shadow: 1px 1px 0 #000;
      }
      .menu-title {
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
        margin: -20px -22px 6px;
        padding: 12px 22px 10px;
        border-bottom: 1px solid transparent;
      }
      .ship-panel {
        position: absolute;
        right: 28px;
        top: 84px;
        width: 300px;
        padding: 0 18px 0;
        border: 2px solid transparent;
        text-shadow: 1px 1px 0 #000;
        pointer-events: auto;
      }
      .ship-title {
        margin: 0 -18px 4px;
        padding: 12px 18px 10px;
        font-size: 17px;
        letter-spacing: 0.04em;
        font-weight: 600;
        border-bottom: 1px solid transparent;
      }
      .ship-part {
        padding: 8px 0 4px;
      }
      .ship-part-heading {
        margin-bottom: 6px;
        padding-bottom: 4px;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
        border-bottom: 1px solid transparent;
      }
      .ship-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 2px 0;
      }
      .ship-label {
        color: var(--dim);
      }
      .ship-value {
        text-align: right;
      }
      .ship-later {
        display: inline-block;
        padding: 2px 10px;
        font-size: 12px;
        letter-spacing: 0.08em;
        border: 2px solid transparent;
        color: var(--dim);
      }
      .ship-footer {
        margin: 10px -18px 0;
        padding: 10px 18px 12px;
        border-top: 1px solid transparent;
      }
      .ship-footer button {
        width: 100%;
      }
      .menu button {
        text-align: left;
        font-size: 15px;
      }
      .marks {
        position: absolute;
        inset: 0;
      }
      /* The held map's names, the ship and the card, laid over the parchment the GPU draws: written in its ink. */
      .held-map {
        position: absolute;
        inset: 0;
        pointer-events: none;
        --map-ink: #3a2816;
        --map-route: #781c14;
      }
      .held-map > * {
        position: absolute;
        left: 0;
        top: 0;
      }
      .held-mark {
        padding: 0 0 0 9px;
        margin-top: -8px;
        font:
          italic 14px Georgia,
          serif;
        color: var(--map-ink);
        white-space: nowrap;
        text-shadow:
          0 0 3px rgba(238, 222, 190, 0.95),
          0 0 1px rgba(238, 222, 190, 1);
      }
      .held-mark::before {
        content: '';
        position: absolute;
        left: -4px;
        top: 4px;
        width: 6px;
        height: 6px;
        border: 1.5px solid var(--map-ink);
        border-radius: 50%;
      }
      .held-mark.port {
        font-style: normal;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .held-mark.port::before {
        background: var(--map-ink);
      }
      .held-mark.chosen {
        color: var(--map-route);
      }
      .held-ship {
        width: 0;
        height: 0;
        margin: -9px 0 0 -6px;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-bottom: 16px solid var(--map-route);
        transform-origin: 6px 9px;
      }
      .held-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 14px;
        background: var(--panel);
        border: 1px solid var(--gold);
        border-radius: 4px;
        white-space: nowrap;
        text-shadow: none;
      }
      .held-card button {
        pointer-events: auto;
      }
      .mark {
        --size: 28px;
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        padding: 0 !important;
        border: none !important;
        background: none !important;
        overflow: visible;
      }
      .mark .glyph {
        position: absolute;
        left: calc(var(--size) / -2);
        top: calc(var(--size) / -2);
        width: var(--size);
        height: var(--size);
        display: grid;
        place-items: center;
        font-size: calc(var(--size) * 0.5);
        border-radius: 50%;
        background: rgba(10, 13, 17, 0.6);
        border: 2px solid var(--kind, var(--ink));
        color: var(--kind, var(--ink));
      }
      .mark .name,
      .mark .note {
        position: absolute;
        left: 0;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .mark .name {
        top: calc(var(--size) / 2 + 4px);
        font-weight: 600;
      }
      .mark .note {
        top: calc(var(--size) / 2 + 22px);
        font-size: 11px;
        color: var(--dim);
      }
      .mark .arrow {
        position: absolute;
        left: -6px;
        top: -6px;
        width: 12px;
        height: 12px;
        font-size: 10px;
        line-height: 12px;
        text-align: center;
        color: var(--kind, var(--ink));
        transform-origin: 6px 6px;
      }
      .mark.held .note,
      .mark.unnamed .name,
      .mark.unnamed .note {
        display: none;
      }
      .mark:hover .glyph {
        background: rgba(30, 36, 44, 0.85);
      }
      .mark.chosen .glyph {
        border-color: var(--gold);
        box-shadow:
          0 0 0 3px rgba(243, 207, 106, 0.35),
          0 0 18px rgba(243, 207, 106, 0.6);
      }
      .mark.chosen .name {
        color: var(--gold);
      }
      .mark.social {
        --kind: #f3cf6a;
      }
      .mark.patrol {
        --kind: #8ed081;
      }
      .mark.mission {
        --kind: #7fb4ee;
      }
      .mark.dungeon {
        --kind: #c193e6;
      }
      .mark.boss {
        --kind: #ee7c6e;
      }
      .mark.port {
        --kind: #e8e4d6;
      }
      .veil {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #05070a;
        opacity: 0;
        transition: opacity 0.7s;
        pointer-events: none;
      }
      .veil.shown {
        opacity: 1;
        pointer-events: auto;
      }
      .veil-text {
        font-size: 18px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--dim);
        animation: breathe 2.4s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
