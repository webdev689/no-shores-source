<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Overlook</title>
    <link rel="stylesheet" href="/src/face.css" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2efe6;
        --panel: rgba(10, 13, 17, 0.72);
        --gold: #f3cf6a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* The world's canvas fills the page; every other canvas (an emote, a gear picture) keeps a size of its own. */
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: var(--ink);
        text-shadow: 1px 1px 0 #000;
      }
      /* What still stands over the canvas as the page's wears the Enhanced Plus kit (client/src/plus/), which paints
         each surface by its role; this sheet gives each press the 2 px border the kit's frame lands on. A rule here
         that outranks the kit's sets a border's width and style only, never its colour. */
      #hud button {
        pointer-events: auto;
        font: inherit;
        border-width: 2px;
        border-style: solid;
        border-radius: 0;
        padding: 7px 14px;
        cursor: pointer;
        text-shadow: 1px 1px 0 #000;
      }
      #hud button:disabled {
        cursor: default;
      }
      [hidden] {
        display: none !important;
      }
      /* The held map's names, the ship and the card, laid over the parchment the GPU draws: written in its ink. */
      .held-map {
        position: absolute;
        inset: 0;
        pointer-events: none;
        --map-ink: #3a2816;
        --map-route: #781c14;
      }
      .held-map > * {
        position: absolute;
        left: 0;
        top: 0;
      }
      .held-mark {
        padding: 0 0 0 9px;
        margin-top: -8px;
        font-size: 11px;
        color: var(--map-ink);
        white-space: nowrap;
        text-shadow:
          -1px 0 0 #eedebe,
          1px 0 0 #eedebe,
          0 -1px 0 #eedebe,
          0 1px 0 #eedebe;
      }
      .held-mark::before {
        content: '';
        position: absolute;
        left: -4px;
        top: 4px;
        width: 6px;
        height: 6px;
        border: 1.5px solid var(--map-ink);
        border-radius: 50%;
      }
      .held-mark.port {
        font-style: normal;
        font-weight: 500;
        letter-spacing: round(up, calc(1em / 22), 1px);
      }
      .held-mark.port::before {
        background: var(--map-ink);
      }
      .held-mark.chosen {
        color: var(--map-route);
      }
      .held-ship {
        width: 0;
        height: 0;
        margin: -9px 0 0 -6px;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-bottom: 16px solid var(--map-route);
        transform-origin: 6px 9px;
      }
      .held-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 14px;
        background: var(--panel);
        border: 1px solid var(--gold);
        border-radius: 4px;
        white-space: nowrap;
        text-shadow: none;
      }
      .held-card button {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
