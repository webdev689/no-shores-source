<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>World Editor</title>
    <link rel="stylesheet" href="/src/face.css" />
    <style>
      :root {
        color-scheme: dark;
        color: #e8e8e8;
        background: #0b0d10;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 300px 1fr;
      }
      #panel {
        overflow-y: auto;
        padding: 12px 14px;
        background: #14181d;
        border-right: 1px solid #2a3038;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: round(up, calc(3em / 22), 1px);
        color: #9aa4b0;
        margin: 16px 0 6px;
      }
      .hint,
      .cursor,
      .status {
        color: #9aa4b0;
      }
      .fight p {
        margin: 2px 0;
      }
      .told {
        color: #9aa4b0;
      }
      .warning {
        color: #ff6b5b;
      }
      .row,
      .column {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .column {
        flex-direction: column;
      }
      button {
        background: #222a33;
        color: inherit;
        border: 1px solid #36404c;
        border-radius: 4px;
        padding: 5px 8px;
        cursor: pointer;
        text-align: left;
      }
      button.active {
        background: #3b5b7d;
        border-color: #6f9fd1;
      }
      .brush {
        display: block;
        margin-top: 10px;
      }
      .slots {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .slots li {
        display: grid;
        grid-template-columns: 22px 1fr;
        gap: 2px 8px;
        padding: 5px 6px;
        border-radius: 4px;
        cursor: pointer;
      }
      .slots li.active {
        background: #222a33;
        outline: 1px solid #6f9fd1;
      }
      .swatch {
        grid-row: span 3;
        width: 22px;
        height: 22px;
        border-radius: 4px;
        color: #000;
        display: grid;
        place-items: center;
      }
      .area {
        color: #9aa4b0;
      }
      li[data-standing='fits'] .area {
        color: #8fd18f;
      }
      li[data-standing='too small'] .area,
      li[data-standing='too large'] .area {
        color: #f0a35a;
      }
      .bar {
        height: 4px;
        background: #2a3038;
        border-radius: 2px;
      }
      .fill {
        display: block;
        height: 100%;
        background: #6f9fd1;
        border-radius: 2px;
      }
      .problems {
        padding-left: 18px;
        margin: 0;
      }
      .problems button {
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        text-decoration: underline dotted;
        cursor: pointer;
      }
      main {
        position: relative;
      }
      #map,
      #overlay,
      #land,
      #isles,
      #land-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #map {
        cursor: crosshair;
      }
      [hidden] {
        display: none !important;
      }
      #overlay,
      #land-overlay {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <aside id="panel">
      <nav id="modes" class="row"></nav>
      <div id="continents-panel"></div>
      <div id="land-panel" hidden></div>
      <div id="isles-panel" hidden></div>
    </aside>
    <main>
      <canvas id="map"></canvas>
      <svg id="overlay"></svg>
      <canvas id="land" hidden></canvas>
      <canvas id="isles" hidden></canvas>
      <svg id="land-overlay" hidden></svg>
    </main>
    <script type="module" src="/src/editorPage.ts"></script>
  </body>
</html>
