<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>World Editor</title>
    <link rel="stylesheet" href="/src/face.css" />
    <style>
      :root {
        color-scheme: dark;
        background: #0b0d10;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* The editor draws its panel, its views and everything over them on this one canvas. */
      #editor {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="editor" role="application" aria-label="World Editor"></canvas>
    <script type="module" src="/src/editorPage.ts"></script>
  </body>
</html>
