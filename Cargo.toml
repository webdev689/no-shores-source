[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# Numbers read to the nearest value, as every browser writes them: the land agrees to the bit.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
# Sines and arctangents in pure Rust, compiled into the rules, so every machine rounds them alike. Without its
# default `arch` feature it takes the same software path on every target.
libm = { version = "0.2.16", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
min_ident_chars = "warn"

[profile.dev]
# The game's own crates build fast and debuggable; dependencies are optimised once and cached,
# so a debug build still runs at a usable frame rate.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
